<div class="pc-main">
<div class="topbar"><a href="profile.html" class="back">‹</a><span>员工/徒弟账号</span><span style="width:20px"></span></div>
<div class="card plain" id="list"></div>
<div class="card plain">
  <h3>加徒弟账号</h3>
  <input class="input" id="staffPhone" placeholder="徒弟手机号">
  <input class="input" id="staffPwd" placeholder="初始密码">
  <input class="input" id="staffName" placeholder="怎么称呼（如：小张）">
  <button class="btn" onclick="addStaff()">添加</button>
</div>
<script src="assets/app.js"></script>
<script>
load();
async function load(){
  const d=await api('staff.php?a=list');
  if(d.code!==1||!d.list){
    list.innerHTML=`
      <div class="item-row" style="opacity:.5"><div style="flex:1">老板 <small style="color:#999">138****8888</small></div></div>
      <div class="item-row" style="opacity:.5"><div style="flex:1">小张 <small style="color:#999">139****6666 · 徒弟</small></div></div>
      <p style="text-align:center;color:#bbb;font-size:12px;margin-top:16px">↑ 示范数据，登录后显示你自己的员工</p>`;
    return;
  }
  list.innerHTML=d.list.map(x=>{
    const badge = x.role==='boss'
      ? '<span style="background:linear-gradient(135deg,#e8632a,#f0854a);color:#fff;padding:1px 8px;border-radius:8px;font-size:11px;margin-left:6px">老板</span>'
      : '<span style="background:#e8f0fc;color:#3b6fd4;padding:1px 8px;border-radius:8px;font-size:11px;margin-left:6px">徒弟</span>';
    const statusBadge = x.role==='staff'
      ? (parseInt(x.disabled)===1
        ? '<span style="background:#fde8e8;color:#d93030;padding:1px 8px;border-radius:8px;font-size:11px;margin-left:6px">已停用</span>'
        : '<span style="background:#e8f8e8;color:#2a9d4a;padding:1px 8px;border-radius:8px;font-size:11px;margin-left:6px">正常</span>')
      : '';
    return `<div class="item-row">
    <div style="flex:1"><b>${x.name}</b>${badge}${statusBadge}<br><small style="color:#999">${x.phone}</small></div>
    ${x.role==='staff'?`<button class="chip" onclick="resetPwd(${x.id})">改密码</button>
    ${parseInt(x.disabled)===1
      ? `<button class="chip" style="background:#e8f8e8;color:#2a9d4a" onclick="enableStaff(${x.id})">启用</button>`
      : `<button class="chip" style="color:#d93030" onclick="disable(${x.id})">停用</button>`}`:''}
  </div>`;
  }).join('')||'<div class="empty">还没有徒弟账号，下面添加</div>';
}
async function addStaff(){
  await api('staff.php?a=add',{method:'POST',body:{phone:staffPhone.value,password:staffPwd.value,name:staffName.value}});
  load();
}
async function resetPwd(id){
  const p=prompt('新密码：');if(p)await api('staff.php?a=reset_pwd',{method:'POST',body:{id,password:p}});
}
async function enableStaff(id){
  await api('staff.php?a=enable',{method:'POST',body:{id}});
  load();
}
async function disable(id){
  if(!confirm('确定停用？停用后徒弟需重新登录'))return;
  await api('staff.php?a=disable',{method:'POST',body:{id}});
  load();
}
</script></div>
