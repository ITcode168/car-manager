<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.ico" type="image/x-icon">
<title>常用项目</title>
<link rel="stylesheet" href="assets/style.css"></head><body>

<div class="pc-sidebar" id="sidebar"></div>
<div class="pc-main">
<div class="topbar"><a href="profile.html" class="back">‹</a><span>常用项目</span><span style="width:20px"></span></div>
<div class="card plain" id="list"></div>
<div class="card plain" id="addBox">
  <h3>加新项目</h3>
  <input class="input" id="newName" placeholder="项目名（如：镀晶）">
  <input class="input" id="newPrice" type="number" placeholder="价格">
  <button class="btn" onclick="addItem()">添加</button>
</div>
<script src="assets/app.js"></script>
<script>
const myRole=localStorage.getItem('role')||'boss';
const myName=localStorage.getItem('myName')||'';
document.getElementById('sidebar').innerHTML=`
  <div class="logo"><span class="logo-circle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e8632a" stroke-width="1.8" stroke-linecap="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-8 8l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 8-8l-3.8 3.8z"/></svg></span>车掌柜</div>
  <a href="index.html"><svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>首页</a>
  <a href="records.html"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="13" y2="16"/></svg>维修记录</a>
  <a href="cars.html"><svg viewBox="0 0 24 24"><path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11"/><path d="M4 11h16v6H4z"/><circle cx="7.5" cy="17" r="1.5"/><circle cx="16.5" cy="17" r="1.5"/></svg>车辆列表</a>
  <a href="add.html"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>记一笔</a>
  <a href="items.html" class="active"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-8 8l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 8-8l-3.8 3.8z"/></svg>常用项目</a>
  ${myRole==='boss'?'<a href="staff.html"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-1a6 6 0 0 1 12 0v1"/></svg>员工管理</a>':''}
  <a href="profile.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>我的</a>
  ${myRole==='boss'?'<a href="settings.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>设置</a>':''}`;

// 徒弟也能加自己的项目，但只能改自己的
async function init(){
  try{const s=await api('settings.php?a=get');myRole=s.role||'boss';myName=s.name||'';localStorage.setItem('role',myRole);localStorage.setItem('myName',myName);}catch(e){}
  load();
}
init();
async function load(){
  const d=await api('items.php?a=list');
  if(d.code!==1||!d.list){list.innerHTML='<div class="empty">暂无项目</div>';return;}
  list.innerHTML=d.list.map(i=>{
    const canEdit=(myRole==='boss')||(i.created_by===myName);
    return `<div class="item-row" id="row-${i.id}" data-name="${i.name}" data-price="${i.price}">
      <div class="item-info" style="flex:1">${i.name} <small style="color:#999">¥${i.price}</small> ${i.created_by_name&&i.created_by_name!=='老板'?'<small style="color:#aaa">· '+i.created_by_name+'</small>':''}</div>
      ${i.can_edit==1?`<button class="chip" onclick="editItem(${i.id})">修改</button>
      <button class="chip" onclick="delItem(${i.id})">删除</button>`:''}
    </div>`;
  }).join('')||'<div class="empty">暂无项目，先加几个</div>';
}
async function addItem(){
  if(!newName.value.trim()){alert('请填项目名');return;}
  await api('items.php?a=save',{method:'POST',body:{name:newName.value,price:newPrice.value}});
  newName.value='';newPrice.value='';
  load();
}
function editItem(id){
  const row=document.getElementById('row-'+id);
  const nm=row.dataset.name;
  const pr=row.dataset.price;
  row.querySelector('.item-info').innerHTML=`<input class="input" id="editName" value="${nm}" style="padding:4px 8px;margin:2px 0;width:120px;display:inline-block"><input class="input" id="editPrice" type="number" value="${pr}" style="padding:4px 8px;margin:2px 0;width:80px;display:inline-block">`;
  row.querySelectorAll('.chip').forEach(c=>c.remove());
  row.insertAdjacentHTML('beforeend',`<button class="chip chip-on" onclick="saveEdit(${id})">保存</button><button class="chip" onclick="load()">取消</button>`);
}
async function saveEdit(id){
  await api('items.php?a=save',{method:'POST',body:{id,name:editName.value,price:editPrice.value}});
  load();
}
async function delItem(id){
  var ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;';
  var box=document.createElement('div');
  box.style.cssText='background:#fff;border-radius:16px;width:80%;max-width:320px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.2)';
  box.innerHTML='<div style="padding:28px 24px 20px;text-align:center;font-size:16px;color:#333;font-weight:500">确定删除这个项目？</div>';
  var btns=document.createElement('div');
  btns.style.cssText='display:flex;border-top:1px solid #f0f0f0';
  var cancel=document.createElement('button');
  cancel.textContent='取消';
  cancel.style.cssText='flex:1;padding:15px;border:none;background:#fff;color:#666;font-size:15px;cursor:pointer';
  cancel.onclick=function(){document.body.removeChild(ov);};
  var ok=document.createElement('button');
  ok.textContent='确认删除';
  ok.style.cssText='flex:1;padding:15px;border:none;background:#fff;color:#d93030;font-size:15px;font-weight:600;cursor:pointer;border-left:1px solid #f0f0f0';
  ok.onclick=async function(){
    document.body.removeChild(ov);
    await api('items.php?a=delete',{method:'POST',body:{id}});
    load();
  };
  btns.appendChild(cancel);btns.appendChild(ok);
  box.appendChild(btns);
  ov.appendChild(box);
  document.body.appendChild(ov);
}
</script>
</div>
</body></html>
