<div class="card plain">
  <h3>修改密码</h3>
  <input class="input" id="oldPwd" type="password" placeholder="原密码">
  <input class="input" id="newPwd" type="password" placeholder="新密码（至少6位）">
  <input class="input" id="confirmPwd" type="password" placeholder="确认新密码">
  <button class="btn" onclick="changePwd()">确认修改</button>
</div>
<script src="assets/app.js"></script>
<script>
async function changePwd(){
  const old=oldPwd.value, nw=newPwd.value, cf=confirmPwd.value;
  if(!old){alert('请输入原密码');return;}
  if(nw.length<6){alert('新密码至少6位');return;}
  if(nw!==cf){alert('两次新密码不一致');return;}
  const d=await api('settings.php?a=change_pwd',{method:'POST',body:{old_pwd:old,new_pwd:nw}});
  if(d.code===1){alert('密码已修改');location.href='profile.html';}
  else alert(d.msg||'修改失败');
}
</script></div>
