<script>
load();
async function load(){
  const [s,cfg]=await Promise.all([api('stats.php'),api('settings.php?a=get')]);
  if(s.code===1){
    const expire = cfg.expire_date;
    let planBadge;
    if(!expire || expire==='0000-00-00'){
      planBadge='<span style="background:#e8f8ee;color:#2a9d4a;padding:3px 10px;border-radius:8px;font-size:12px">内测版</span>';
    } else {
      const left = Math.ceil((new Date(expire)-new Date())/86400000);
      const color = left<7 ? '#d93030' : '#666';
      planBadge=`<span style="color:${color};font-size:13px">有效期至 ${expire}（剩${left}天）</span>`;
    }
    const roleBadge = cfg.role==='boss'
      ? '<span style="background:linear-gradient(135deg,#e8632a,#f0854a);color:#fff;padding:2px 10px;border-radius:10px;font-size:11px;margin-left:6px">老板</span>'
      : '<span style="background:#e8f0fc;color:#3b6fd4;padding:2px 10px;border-radius:10px;font-size:11px;margin-left:6px">徒弟</span>';
    shopCard.innerHTML=`<h3 style="font-size:17px;margin-bottom:8px">${cfg.shop_name||'我的店'}${roleBadge}</h3>
    <div style="margin-bottom:12px">${planBadge}</div>
    <div class="stat-row" style="margin:0">
      <div class="stat-box"><div class="num">${s.monthly.cnt}</div><div class="label">30天单数</div></div>
      <div class="stat-box"><div class="num">¥${s.monthly.total}</div><div class="label">30天收入</div></div>
      <div class="stat-box"><div class="num" style="color:#d93030">¥${s.monthly.credit}</div><div class="label">待收款</div></div>
    </div>`;
  } else {
    shopCard.innerHTML='<div class="empty">请先登录查看数据</div>';
  }
}
