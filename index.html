<script>
load();
// 加载轮播图
loadBanners();
async function loadBanners(){
  try{
    const r=await fetch('api/settings.php?a=banners_public');
    const d=await r.json();
    if(d.code===1 && d.list.length){
      const w=document.getElementById('bannerWrap');
      w.innerHTML=d.list.map((b,i)=>`
        <a href="${b.link_url||'#'}" ${b.link_url?'':'onclick="return false"'}>
          <img src="${b.image_url}" style="display:${i===0?'block':'none'}">
        </a>`).join('')+
        `<div class="banner-dots">${d.list.map((_,i)=>`<span class="${i===0?'on':''}"></span>`).join('')}</div>`;
      // 自动轮播
      let idx=0;const slides=w.querySelectorAll('img');const dots=w.querySelectorAll('.banner-dots span');
      if(slides.length>1){setInterval(()=>{slides[idx].style.display='none';dots[idx].classList.remove('on');idx=(idx+1)%slides.length;slides[idx].style.display='block';dots[idx].classList.add('on');},3500);}
    }
  }catch(e){}
}
async function load(){
  checkPopup();
  const s=await api('stats.php');
  if(s.code===1){
    todayCnt.textContent=s.today.cnt;
    todayTotal.textContent='¥'+s.today.total;
    debtTotal.textContent='¥'+s.monthly.credit;
    // 检查到期提醒
    const cfg=await api('settings.php?a=get');
    if(!cfg.shop_name || cfg.shop_name==='undefined' || cfg.shop_name==='我的店'){
      location.href='settings.html?first=1';
      return;
    }
    if(cfg.expire_date && cfg.expire_date!=='0000-00-00'){
      const left=Math.ceil((new Date(cfg.expire_date)-new Date())/86400000);
      if(left<=7){
        expireTip.style.display='block';
        expireTip.textContent=`会员 ${cfg.expire_date} 到期，还剩 ${left} 天，请联系续费`;
      }
    }
  } else {
    todayCnt.textContent='3';
    todayTotal.textContent='¥1,140';
    debtTotal.textContent='¥380';
    remindList.innerHTML=`
      <div class="item-row" style="opacity:.5">
        <div class="plate-badge">豫E12345</div>
        <div style="flex:1"><b>豫E12345</b> 王哥<br><small style="color:#999">2026-10-05 到期</small></div>
        <button class="chip">发话术</button><button class="chip">已联系</button>
      </div>
      <p style="text-align:center;color:#bbb;font-size:12px">↑ 示范数据</p>`;
    recentList.innerHTML=`
      <div class="item-row" style="opacity:.5">
        <div class="plate-badge">豫E12345</div>
        <div style="flex:1"><b>豫E12345</b> 王哥<br><small style="color:#999">小保养 · 2026-09-28</small></div>
        <b>¥380</b>
      </div>
      <div class="item-row" style="opacity:.5">
        <div class="plate-badge">豫E67890</div>
        <div style="flex:1"><b>豫E67890</b> 李姐<br><small style="color:#999">补胎 · 2026-09-27</small></div>
        <b>¥30</b>
      </div>
      <p style="text-align:center;color:#bbb;font-size:12px">↑ 示范数据，登录后显示你的真实记录</p>`;
    return;
  }
  const a=await api('settings.php?a=announcements');
  if(a.scroll){scrollBar.style.display='block';scrollText.textContent=a.scroll;}
  const r=await api('services.php?a=remind_today');
  if(r.list && r.list.length){
    remindList.innerHTML=r.list.map(x=>`
      <div class="item-row">
        <div class="plate-badge">${x.plate}</div>
        <div style="flex:1"><b>${x.plate}</b> ${x.owner_name||''}<br><small style="color:#999">${x.next_remind_date} 到期</small></div>
        <button class="chip" onclick="genMsg('${x.plate}')">发话术</button>
        <button class="chip" onclick="doneRemind(${x.id})">已联系</button>
      </div>`).join('');
  }
  const rec=await api('services.php?a=list&range=week');
  if(rec.code===1 && rec.list.length){
    recentList.innerHTML=rec.list.slice(0,5).map(x=>`
      <div class="item-row" onclick="location.href='car.html?id=${x.car_id}'">
        <div class="plate-badge">${x.plate}</div>
        <div style="flex:1"><b>${x.plate}</b> ${x.owner_name||''}<br><small style="color:#999">${x.items||''} · ${x.service_date}</small></div>
        <b>¥${x.amount}</b>
      </div>`).join('');
  }
}
async function doSearch(inputId, resultId){
  const kw=document.getElementById(inputId).value.trim();
  const result=document.getElementById(resultId);
  if(!kw){result.innerHTML='';return;}
  try{
    const d=await api('cars.php?a=search&kw='+encodeURIComponent(kw));
    if(d.code!==1 || !d.list){
      // 未登录时显示示范搜索结果
      const kwUpper=kw.toUpperCase();
      const demo=[{plate:'豫E12345',owner:'王哥'},{plate:'豫E67890',owner:'李姐'},{plate:'豫E88888',owner:'赵哥'}];
      const match=demo.filter(c=>c.plate.toUpperCase().includes(kwUpper)||c.owner.includes(kw));
      if(match.length){
        result.innerHTML=match.map(c=>`<div class="item-row" style="opacity:.5"><div class="plate-badge">${c.plate}</div><div><b>${c.plate}</b> ${c.owner}</div></div>`).join('');
      } else {
        result.innerHTML='';
      }
      return;
    }
    result.innerHTML=d.list.map(c=>`<div class="item-row" onclick="location.href='car.html?id=${c.id}'">
      <div class="plate-badge">${c.plate}</div>
      <div><b>${c.plate}</b> ${c.owner_name||''}</div></div>`).join('') || '<div class="empty">没找到，<a href="add.html?plate='+kw+'" style="color:#e8632a">新建车辆</a></div>';
  }catch(e){result.innerHTML='';}
}
function searchCar(){doSearch('searchBox','searchResult');}
function searchCarM(){doSearch('searchBoxM','searchResultM');}
function genMsg(plate){
  prompt('复制发给客户：','你好，你的车该做保养了，方便的时候过来一趟。');
}
async function doneRemind(id){
  await api('services.php?a=remind_done',{method:'POST',body:{id}});
  load();
}
</script>
