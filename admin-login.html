<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.ico" type="image/x-icon">
<title>车掌柜·超管登录</title>
<link rel="stylesheet" href="assets/style.css">
<style>
.hero .logo { width:72px; height:72px; background:#fff; border-radius:50%; margin:0 auto 16px; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(0,0,0,.1); }
.input-row .icon { width:22px; height:22px; flex-shrink:0; margin-right:12px; color:#bbb; font-size:20px; line-height:22px; text-align:center; }
@media (min-width:1024px){
  .hero{display:none;}
  .card,#mobileCard,.ver{display:none !important;}
}
</style>
</head><body>

<!-- 手机端 -->
<div class="hero">
  <div class="logo">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#2d2d2d" stroke-width="1.8" stroke-linecap="round">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-8 8l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 8-8l-3.8 3.8z"/>
    </svg>
  </div>
  <h1>车掌柜</h1>
  <p>超管后台</p>
</div>

<div class="card" id="mobileCard">
  <div class="input-row">
    <span class="icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="1.5">
        <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>
      </svg>
    </span>
    <input id="userM" placeholder="请输入账号" onkeydown="if(event.key==='Enter')pwdM.focus()">
  </div>
  <div class="input-row">
    <span class="icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="1.5">
        <rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
      </svg>
    </span>
    <input id="pwdM" type="password" placeholder="请输入密码" onkeydown="if(event.key==='Enter')loginM()">
  </div>
  <button class="btn" onclick="loginM()">登 录</button>
</div>
<p class="ver">版本 1.0.0</p>

<!-- PC端：和老板登录一样的左右分栏 -->
<div class="login-split">
  <div class="login-left">
    <div class="logo-circle">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#2d2d2d" stroke-width="1.8" stroke-linecap="round">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-8 8l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 8-8l-3.8 3.8z"/>
      </svg>
    </div>
    <h1>车掌柜</h1>
    <p>超管后台</p>
  </div>
  <div class="login-right">
    <div class="login-box">
      <h2 style="font-size:22px;margin-bottom:6px">超管登录</h2>
      <p style="color:#999;font-size:14px;margin-bottom:24px">管理所有店铺</p>
      <div class="input-row">
        <span class="icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="1.5">
            <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>
          </svg>
        </span>
        <input id="userP" placeholder="请输入账号" onkeydown="if(event.key==='Enter')pwdP.focus()">
      </div>
      <div class="input-row">
        <span class="icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="1.5">
            <rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
          </svg>
        </span>
        <input id="pwdP" type="password" placeholder="请输入密码" onkeydown="if(event.key==='Enter')loginP()">
      </div>
      <button class="btn" onclick="loginP()">登 录</button>
      <p style="text-align:center;color:#bbb;font-size:12px;margin-top:20px">版本 1.0.0</p>
    </div>
  </div>
</div>

<script>
async function doLogin(u,p){
  try{
    const r=await fetch('api/admin.php?a=login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,pwd:p})});
    const d=await r.json();
    if(d.code===1){
      sessionStorage.setItem('admin_token',d.token);
      location.href='admin.html';
    }else{
      alert(d.msg||'登录失败');
    }
  }catch(e){
    alert('网络错误：'+e.message);
  }
}
function loginM(){
  var u=document.getElementById('userM').value.trim();
  var p=document.getElementById('pwdM').value;
  if(!u){alert('请输入账号');return;}
  if(!p){alert('请输入密码');return;}
  doLogin(u,p);
}
function loginP(){
  var u=document.getElementById('userP').value.trim();
  var p=document.getElementById('pwdP').value;
  if(!u){alert('请输入账号');return;}
  if(!p){alert('请输入密码');return;}
  doLogin(u,p);
}
</script>
</body></html>
